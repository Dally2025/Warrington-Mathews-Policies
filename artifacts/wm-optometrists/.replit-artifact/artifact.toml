kind = "web"
previewPath = "/"
title = "Warrington & Mathews Optometrists"
version = "1.0.0"
id = "artifacts/wm-optometrists"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19036

[services.development]
run = "pnpm --filter @workspace/wm-optometrists run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wm-optometrists", "run", "build" ]
publicDir = "artifacts/wm-optometrists/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19036"
BASE_PATH = "/"
